[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "threadsyphon"
version = "2.1.0"
description = "Watch 4chan threads and save their media (GTK4 / Arch Linux)"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "threadsyphon contributors" }]
dependencies = []

[project.scripts]
threadsyphon = "threadsyphon.cli:main"

[tool.setuptools.packages.find]
include = ["threadsyphon*"]

[tool.setuptools.package-data]
threadsyphon = ["style.css"]
